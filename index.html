<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome to FaceCard</title>
  <script src="https://cloudflare.com"></script>
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; text-align: center; margin-top: 50px; background-color: #007AFF;">
<center>
  
  <h1 style="font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 400; color:white;">
    Welcome to FaceCard
  </h1>
  
  <input type="text" id="text" placeholder="enter Medical Info">
  <button onclick="generateQR()">keep info to </button>
  <div id="qrcode"></div>

  
  <p id="qrData" style="margin-top: 250px; color:white; font-size: 22px;"> 
    waiting for QR Scan
  </p>

  <script src="script.js"></script> 
  
  <script>
    
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const scannedText = urlParams.get('Qrdata');
      
      if (scannedText) {
        document.getElementById('qrData').innerText = decodeURIComponent(scannedText);
      }
    };
  </script>

</center>
</body>
</html>
